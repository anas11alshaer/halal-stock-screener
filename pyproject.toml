[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Keep CI green on latest ruff while project migrates strict style gradually.
# These pedantic rules are informational for private bot workload.
ignore = [
  "PLW1508",  # env var default type
  "DTZ005",   # naive datetime.now - used consistently with local cache TTL
  "BLE001",   # broad Exception - intentional for external API resilience
  "SIM115",   # NamedTemporaryFile without context manager - test helper
  "TRY002",   # raise Exception in tests - test scaffolding
  "RUF012",   # mutable class var in test fake
  "TRY201",   # raise e vs bare raise - handled in DB helper
  "RUF013",   # implicit Optional - legacy signatures
]
