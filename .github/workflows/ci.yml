name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install ruff pytest pytest-asyncio
      - run: ruff check .
      - run: pytest -o asyncio_mode=auto
        env:
          GEMINI_API_KEY: test_key
          TELEGRAM_BOT_TOKEN: test_token
  # Auto-deploy on merge to main (issue #16). Replays deploy.bat semantics:
  # transfer src/requirements/Dockerfile/.dockerignore, rebuild, recreate the
  # container with the host-side .env + data volume. Runs only after the host
  # (lint+test) job is green, only on pushes to main — never on PRs.
  deploy:
    needs: host
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      # Pinned to the v4 major tag (same as the host job): stable API while
      # still receiving security fixes. No third-party SSH/scp actions are
      # used on purpose — openssh-client ships on ubuntu-latest, keeping the
      # supply-chain surface to first-party actions only.
      - uses: actions/checkout@v4
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
      - name: Transfer files (mirrors deploy.bat step 1)
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "rm -rf ~/stock-screener/src"
          scp -r -i ~/.ssh/deploy_key src "$SSH_USER@$SSH_HOST:~/stock-screener/src"
          scp -i ~/.ssh/deploy_key requirements.txt Dockerfile .dockerignore "$SSH_USER@$SSH_HOST:~/stock-screener/"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
      - name: Build and recreate container (mirrors deploy.bat step 2)
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "cd ~/stock-screener && docker build -t stock-screener-bot:${GITHUB_SHA} -t stock-screener-bot:latest . && docker stop stock-screener || true && docker rm stock-screener || true && docker run -d --name stock-screener --restart unless-stopped --shm-size=256m --env-file .env -v \$(pwd)/data:/app/data stock-screener-bot:${GITHUB_SHA}"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
      # The container publishes no host port, so the probe runs inside it via
      # docker exec using the image's own python: HTTP GET / must return OK.
      - name: Health check (fails the run loudly)
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" bash <<'EOF'
          for i in $(seq 1 12); do
            if docker exec stock-screener python -c "import urllib.request; assert urllib.request.urlopen('http://localhost:8080/', timeout=5).read() == b'OK'"; then
              echo "HEALTHY after attempt $i"
              exit 0
            fi
            echo "attempt $i/12: not ready, waiting 5s..."
            sleep 5
          done
          echo "::error::DEPLOY HEALTH CHECK FAILED — container unhealthy 60s after recreate"
          docker logs --tail 50 stock-screener || true
          exit 1
          EOF
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
      - name: Tail container logs
        if: always()
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "docker logs --tail 20 stock-screener"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
