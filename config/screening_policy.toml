# Policy for the fail-closed eval engine (Issue #7).
# Thresholds, denylists, fusion, coverage floors, and NVIDIA model IDs live here — not in plugin code.

enabled_plugins = [
    "Activity",
    "Ratios",
    "HalalWallet",
    "NportHoldings",
]

[standard]
# Label only. Plugins read numeric limits from [ratios], not this name.
name = "sp_shariah"

[fusion]
name = "conjunction"
required_plugins = ["Activity", "Ratios"]
add_required_when_in_dataset = []

[fusion.required_plugins_by_quote_type]
EQUITY = ["Activity", "Ratios"]
ETF = ["NportHoldings"]
MUTUALFUND = ["NportHoldings"]

[activity]
unquantified_denied_tag = "doubtful"
denied_sectors = [
    "Financial Services",
]
denied_industries = [
    "Aerospace & Defense",
    "Asset Management",
    "Banks - Diversified",
    "Banks - Regional",
    "Beverages - Brewers",
    "Beverages - Wineries & Distilleries",
    "Capital Markets",
    "Credit Services",
    "Financial Conglomerates",
    "Gambling",
    "Insurance Brokers",
    "Insurance - Diversified",
    "Insurance - Life",
    "Insurance - Property & Casualty",
    "Insurance - Reinsurance",
    "Insurance - Specialty",
    "Mortgage Finance",
    "Resorts & Casinos",
    "Tobacco",
]
denied_industry_substrings = [
    "tobacco", "brewers", "winery", "distiller",
    "casino", "gambling", "cannabis", "marijuana",
    "adult entertainment",
]
# Do not add "Financial Data & Stock Exchanges", GICS 40203040 / 40201060,
# Movies & Entertainment, or Advertising.

[ratios]
debt_to_market_cap_pct = 33.0
# Absent use_trailing_avg_market_cap: spot market cap.
use_trailing_avg_market_cap = true
trailing_avg_months = 36
spot_fallback_ok = true
cash_to_market_cap_pct = 30.0
receivables_to_market_cap_pct = 49.0
impermissible_income_to_revenue_pct = 5.0
margin_pct = 0.0
# Absent cash_screen_enabled / receivables_screen_enabled: screens on.
cash_screen_enabled = false
receivables_screen_enabled = false
use_sec_companyfacts = true
yfinance_interest_income_rows = [
    "Interest Income",
    "InterestIncome",
    "Interest Income Non Operating",
    "InterestIncomeNonOperating",
    "Net Interest Income",
]
yfinance_revenue_rows = [
    "Total Revenue",
    "TotalRevenue",
    "Operating Revenue",
]
yfinance_debt_rows = [
    "Total Debt",
    "TotalDebt",
    "Net Debt",
]
yfinance_cash_rows = [
    "Cash Cash Equivalents And Short Term Investments",
    "CashAndCashEquivalents",
    "Cash And Cash Equivalents",
    "Cash And Short Term Investments",
]
yfinance_receivable_rows = [
    "Net Receivables",
    "Accounts Receivable",
    "AccountsReceivable",
    "Receivables",
]
companyfacts_interest_income_tags = [
    "InterestIncomeOperating",
    "InterestAndDividendIncomeOperating",
    "InvestmentIncomeInterest",
    "InterestIncomeExpenseNet",
]
companyfacts_revenue_tags = [
    "Revenues",
    "RevenueFromContractWithCustomerExcludingAssessedTax",
    "SalesRevenueNet",
]
companyfacts_debt_tags = [
    "LongTermDebt",
    "LongTermDebtNoncurrent",
    "DebtCurrent",
    "ShortTermBorrowings",
]
companyfacts_cash_tags = [
    "CashAndCashEquivalentsAtCarryingValue",
    "CashCashEquivalentsAndShortTermInvestments",
    "AvailableForSaleSecuritiesCurrent",
    "ShortTermInvestments",
]
companyfacts_receivable_tags = [
    "AccountsReceivableNetCurrent",
    "AccountsReceivableNet",
    "AccountsAndOtherReceivablesNetCurrent",
]

[etf]
coverage_floor = 0.95
lookthrough_max_depth = 1
fund_quote_types = ["ETF", "MUTUALFUND"]
skip_asset_categories = ["STIV"]

[halalwallet]
dataset_url = "https://www.halalwallet.us/api/data/halal-stock-screening-data-us.json"
pass_verdicts = ["halal"]
fail_verdicts = ["not_halal"]

[sources]
# App name only; contact email is SEC_CONTACT_EMAIL in .env (via src/config.py).
sec_user_agent_name = "halal-stock-screener"
sec_company_tickers_mf_url = "https://www.sec.gov/files/company_tickers_mf.json"
sec_company_tickers_url = "https://www.sec.gov/files/company_tickers.json"
sec_submissions_url = "https://data.sec.gov/submissions/CIK{cik}.json"
sec_archives_url = "https://www.sec.gov/Archives/edgar/data/{cik}/{accession}/{document}"
sec_companyfacts_url = "https://data.sec.gov/api/xbrl/companyfacts/CIK{cik}.json"
openfigi_mapping_url = "https://api.openfigi.com/v3/mapping"
openfigi_retry_seconds = 65

[nvidia]
# MiniMax-M3 is non-commercial on NIM; do not reuse as a searcher or checker default.
# OCR needs ocr_url (CV endpoint, not chat completions).
ocr_url = "https://ai.api.nvidia.com/v1/cv/nvidia/nemotron-ocr-v2"
chat_url = "https://integrate.api.nvidia.com/v1/chat/completions"
winner = "minimaxai/minimax-m3"
fallback_429 = "nvidia/nemotron-nano-12b-v2-vl"
screenshot_dir = "tests/fixtures/screenshots"
screenshot_manifest = "manifest.json"
timeout_seconds = 180
ticker_prompt = """Extract every stock or ETF ticker symbol visible in this brokerage screenshot.
Return JSON only, no markdown: {"tickers": ["AAPL", "MSFT"]}
Tickers are 1-5 letters, optionally a class suffix like BRK.B or an exchange suffix like ALV.DE or 9OC.SG. Do not guess missing symbols."""

[[nvidia.bakeoff_models]]
id = "minimaxai/minimax-m3"
kind = "vlm"

[[nvidia.bakeoff_models]]
id = "nvidia/nemotron-nano-12b-v2-vl"
kind = "vlm"

[[nvidia.bakeoff_models]]
id = "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"
kind = "vlm"

[[nvidia.bakeoff_models]]
id = "nvidia/nemotron-ocr-v2"
kind = "ocr"
url = "https://ai.api.nvidia.com/v1/cv/nvidia/nemotron-ocr-v2"

[[nvidia.bakeoff_models]]
id = "nvidia/llama-3.1-nemotron-nano-vl-8b-v1"
kind = "vlm"

[[nvidia.bakeoff_models]]
id = "meta/llama-3.2-11b-vision-instruct"
kind = "vlm"

[nvidia.jobs.screenshot_tickers]
winner = "minimaxai/minimax-m3"
fallback_429 = "nvidia/nemotron-nano-12b-v2-vl"
